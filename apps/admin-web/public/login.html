<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 - 샛강역 내비</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>
      </div>
      <h1>샛강역 내비</h1>
      <p>관리자 전용</p>
    </div>
    <h2>로그인</h2>
    <div id="error-msg" class="error-msg" style="display:none;"></div>
    <div class="form-group">
      <label for="username">아이디</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" id="login-btn">로그인</button>
  </div>

  <script>
    document.getElementById('login-btn').addEventListener('click', login);
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      if (!username || !password) {
        errEl.textContent = '아이디와 비밀번호를 입력하세요.';
        errEl.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          location.href = '/admin/dashboard.html';
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.error || '로그인 실패';
          errEl.style.display = 'block';
        }
      } catch (e) {
        errEl.textContent = '서버 연결 오류';
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
