<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>샛강역 내비게이션</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">

  <!-- ===== QR 스캐너 섹션 ===== -->
  <section id="qr-section">
    <video id="qr-video" playsinline autoplay muted></video>
    <canvas id="qr-canvas"></canvas>
    <div class="qr-overlay-frame">
      <div class="qr-scan-line"></div>
    </div>
    <p class="qr-hint-text">입구 QR 코드를 카메라에 비춰 주세요</p>
    <p id="scanner-error" style="display:none; color:#FF6B35; margin-top:12px; font-size:13px; text-align:center; padding:0 24px;">
      카메라 접근이 거부되었습니다.<br>브라우저 설정에서 카메라 권한을 허용해 주세요.
    </p>
    <!-- scanner-error 텍스트는 applyI18n()이 언어에 맞게 업데이트함 -->
  </section>

  <!-- ===== 상단 헤더 ===== -->
  <header id="app-header">
    <span class="app-title">샛강역 내비게이션</span>
    <!-- 언어 선택 버튼 -->
    <button id="lang-btn" onclick="toggleLang()" aria-label="언어 변경 / Change Language">EN</button>
    <!-- 교통약자 토글 -->
    <label class="mobility-toggle-wrap" title="교통약자 모드">
      <span class="mobility-toggle-label">교통약자</span>
      <span class="toggle-switch">
        <input type="checkbox" id="mobility-toggle" role="switch" aria-label="교통약자 모드 (엘리베이터 우선)">
        <span class="toggle-slider"></span>
      </span>
    </label>
  </header>

  <!-- ===== 지도 영역 (입면도 + 평면도 동시 표시) ===== -->
  <div id="map-area">

    <!-- 수직약도 (항상 표시) -->
    <div id="elev-panel">
      <div class="map-container">
        <img src="/images/elevation.svg" alt="수직약도" style="display:block;width:100%;height:auto;">
        <svg id="overlay-elev" class="path-overlay" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      </div>
    </div>

    <!-- 평면도 탭 바 -->
    <nav id="floor-tabs" role="tablist">
      <button class="floor-tab-btn active" role="tab" aria-selected="true"  data-tab="b1" onclick="switchTab('b1')">B1 평면도</button>
      <button class="floor-tab-btn"        role="tab" aria-selected="false" data-tab="b2" onclick="switchTab('b2')">B2 평면도</button>
    </nav>

    <!-- 평면도 패널 -->
    <div id="floor-panel">
      <!-- B1 평면도 -->
      <div class="map-panel active" id="tab-b1" role="tabpanel">
        <div class="map-container">
          <img src="/images/floor-b1.svg" alt="B1 평면도" style="display:block;width:100%;height:auto;">
          <svg id="overlay-b1" class="path-overlay" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        </div>
      </div>

      <!-- B2 평면도 -->
      <div class="map-panel" id="tab-b2" role="tabpanel">
        <div class="map-container">
          <img src="/images/floor-b2.svg" alt="B2 평면도" style="display:block;width:100%;height:auto;">
          <svg id="overlay-b2" class="path-overlay" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        </div>
      </div>
    </div><!-- /#floor-panel -->

  </div><!-- /#map-area -->

  <!-- ===== 경로 안내 정보 바 ===== -->
  <div id="nav-info-bar">
    <!-- updateNavInfo()가 채워줌 -->
  </div>

  <!-- ===== 하단 바 ===== -->
  <div id="bottom-bar">
    <button id="dest-select-btn" onclick="onDestSelectBtnClick()">목적지 선택</button>
    <button id="qr-scan-btn" onclick="showQrScanner()">
      <span>&#9633;</span> QR 스캔
    </button>
  </div>

  <!-- ===== 배경 스크림 ===== -->
  <div id="scrim" onclick="hideDestinationPanel()"></div>

  <!-- ===== 도착지 선택 패널 (하단 슬라이드업) ===== -->
  <div id="dest-panel" role="dialog" aria-modal="true" aria-label="목적지 선택">
    <div id="dest-panel-header">
      <span id="dest-panel-title">목적지를 선택하세요</span>
      <button id="dest-panel-close" aria-label="닫기" onclick="hideDestinationPanel()">&#x2715;</button>
    </div>
    <div id="dest-list">
      <!-- destination-list alias — loadDestinations()가 채워줌 -->
      <div id="destination-list">
        <p style="padding:16px; color:#6c757d; font-size:13px;">목적지 로드 중…</p>
      </div>
    </div>
  </div>

</div><!-- /#app -->

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/js/qr-scanner.js?v=20260308c"></script>
<script src="/js/app.js?v=20260308c"></script>
</body>
</html>
