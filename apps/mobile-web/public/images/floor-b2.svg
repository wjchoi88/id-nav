<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" id="floor-b2-svg">
  <defs>
    <style>
      .fl  { font: bold 13px sans-serif; fill: #1E293B; }
      .al  { font: 11px sans-serif; fill: #475569; }
      .wall     { fill: #E2E8F0; stroke: #CBD5E1; stroke-width: 2; }
      .corridor { fill: #FFF7ED; stroke: #FED7AA; stroke-width: 1.5; }
      .gate     { fill: #FEF3C7; stroke: #F59E0B; stroke-width: 1.5; }
      .dim-up   { fill: #DBEAFE; stroke: #93C5FD; stroke-width: 1; opacity: 0.25; }
      .dim-txt  { font: 11px sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#F8FAFC"/>

  <!-- 외벽 -->
  <rect x="50" y="55" width="900" height="690" rx="8" class="wall"/>

  <!-- 타 층 표시 (희미하게): B1 9호선 승강장 위치 참고용 -->
  <rect x="65" y="65" width="230" height="100" rx="4" class="dim-up"/>
  <text x="180" y="122" text-anchor="middle" class="dim-txt">↑ B1 9호선 (여의도)</text>
  <rect x="705" y="65" width="230" height="100" rx="4" class="dim-up"/>
  <text x="820" y="122" text-anchor="middle" class="dim-txt">↑ B1 9호선 (중앙보훈병원)</text>

  <!-- 타 층 표시 (희미하게): B4 신림선 승강장 위치 참고용 -->
  <rect x="65" y="635" width="230" height="100" rx="4" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1" opacity="0.25"/>
  <text x="180" y="692" text-anchor="middle" class="dim-txt">↓ B4 신림선 (관악산)</text>
  <rect x="705" y="635" width="230" height="100" rx="4" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1" opacity="0.25"/>
  <text x="820" y="692" text-anchor="middle" class="dim-txt">↓ B4 신림선 (샛강)</text>

  <!-- ══ 중앙 통로 ══ -->
  <rect x="295" y="165" width="410" height="470" rx="4" class="corridor"/>

  <!-- ══ 신림선 환승 개찰구 (B2-A02) ══ -->
  <rect x="330" y="320" width="340" height="80" rx="4" class="gate"/>
  <line x1="350" y1="348" x2="650" y2="348" stroke="#F59E0B" stroke-width="2" stroke-dasharray="14,8"/>
  <text x="500" y="365" text-anchor="middle" class="fl">신림선 환승 개찰구</text>
  <!-- 앵커: 아래 가장자리 중간 -->
  <circle id="map-B2-A02" cx="500" cy="400" r="7" fill="#F97316" stroke="#fff" stroke-width="2" data-anchor="B2-A02"/>

  <!-- ══ 엘리베이터 (B2-A01) — 픽토그램 ══ -->
  <rect x="430" y="195" width="140" height="100" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <!-- 엘리베이터 픽토그램 -->
  <g transform="translate(450,210)">
    <polygon points="15,0 8,10 22,10" fill="#2563EB"/>
    <polygon points="65,26 58,16 72,16" fill="#2563EB"/>
    <rect x="0" y="12" width="36" height="36" rx="2" fill="none" stroke="#2563EB" stroke-width="2"/>
    <line x1="18" y1="12" x2="18" y2="48" stroke="#2563EB" stroke-width="1.5"/>
  </g>
  <text x="500" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563EB">ELV</text>
  <text x="500" y="316" text-anchor="middle" font-size="9" fill="#2563EB">↑B1 · ↓B4</text>
  <!-- 앵커: 아래 가장자리 중간 -->
  <circle id="map-B2-A01" cx="500" cy="295" r="7" fill="#F97316" stroke="#fff" stroke-width="2" data-anchor="B2-A01"/>

  <!-- ══ 계단 (B1↑ / B4↓) ══ -->
  <rect x="330" y="435" width="155" height="90" rx="4" fill="#D1FAE5" stroke="#34D399" stroke-width="1.5"/>
  <!-- 계단 픽토그램 -->
  <g transform="translate(348,450)">
    <rect x="0" y="30" width="10" height="10" fill="none" stroke="#065F46" stroke-width="2"/>
    <rect x="10" y="20" width="10" height="20" fill="none" stroke="#065F46" stroke-width="2"/>
    <rect x="20" y="10" width="10" height="30" fill="none" stroke="#065F46" stroke-width="2"/>
    <rect x="30" y="0" width="10" height="40" fill="none" stroke="#065F46" stroke-width="2"/>
  </g>
  <text x="408" y="482" text-anchor="middle" font-size="11" fill="#065F46">계단</text>
  <text x="408" y="498" text-anchor="middle" font-size="10" fill="#065F46">↑B1 · ↓B4</text>

  <!-- 층간 이동 연결선 (위↔아래, 세로선만) -->
  <!-- B1 엘베 → B2 엘베 -->
  <line x1="500" y1="165" x2="500" y2="195" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- B2 엘베 → B4 엘베 -->
  <line x1="500" y1="635" x2="500" y2="600" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- B1 계단 → B2 계단 -->
  <line x1="408" y1="165" x2="408" y2="435" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <!-- B2 계단 → B4 계단 -->
  <line x1="408" y1="525" x2="408" y2="635" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- 범례 -->
  <rect x="760" y="430" width="145" height="55" rx="4" fill="rgba(255,255,255,0.92)" stroke="#CBD5E1"/>
  <text x="768" y="445" font-size="10" font-weight="bold" fill="#1E293B">범례</text>
  <rect x="768" y="451" width="12" height="8" rx="1" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="785" y="459" font-size="9" fill="#475569">통로</text>
  <rect x="768" y="463" width="12" height="8" rx="1" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="785" y="471" font-size="9" fill="#475569">엘리베이터</text>
  <circle cx="773" cy="479" r="4" fill="#F97316"/>
  <text x="785" y="483" font-size="9" fill="#475569">QR 앵커</text>

  <!-- 경로 오버레이 (JS) -->
  <g id="overlay-b2"></g>
</svg>
