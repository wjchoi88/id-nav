<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="600" height="540" id="elevation-svg">
  <defs>
    <style>
      .floor-label { font: bold 13px sans-serif; fill: #1E293B; }
      .area-label  { font: 11px sans-serif; fill: #475569; }
      .anchor-dot  { fill: #F97316; stroke: #fff; stroke-width: 2; }
      .stair-line  { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      .elev-box    { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2; }
      .floor-line  { stroke: #93C5FD; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="540" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-weight="bold" fill="#1E293B" font-size="15">샛강역 입면도</text>

  <!-- ─── 지상 ─── -->
  <rect x="50" y="42" width="500" height="48" rx="4" fill="#E2E8F0" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="300" y="71" text-anchor="middle" class="floor-label">지상 (출구)</text>
  <!-- 1번 출구 -->
  <rect x="80" y="48" width="80" height="36" rx="2" fill="#fff" stroke="#93C5FD"/>
  <text x="120" y="71" text-anchor="middle" class="area-label">1번 출구</text>
  <!-- 2번 출구 -->
  <rect x="440" y="48" width="80" height="36" rx="2" fill="#fff" stroke="#93C5FD"/>
  <text x="480" y="71" text-anchor="middle" class="area-label">2번 출구</text>

  <!-- 계단 지상→B1 -->
  <line x1="120" y1="90" x2="120" y2="130" class="stair-line" stroke-dasharray="4,3"/>
  <line x1="480" y1="90" x2="480" y2="130" class="stair-line" stroke-dasharray="4,3"/>

  <!-- ─── B1 층 (9호선 승강장) ─── -->
  <rect x="50" y="130" width="500" height="100" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="70" y="153" class="floor-label">B1</text>
  <text x="70" y="168" font-size="10" fill="#475569">9호선 승강장</text>

  <!-- B1: 9호선 승강장 동 -->
  <rect x="400" y="140" width="130" height="80" rx="3" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="465" y="178" text-anchor="middle" class="area-label">9호선 승강장</text>
  <text x="465" y="192" text-anchor="middle" font-size="9" fill="#475569">동쪽</text>
  <!-- B1: 9호선 승강장 서 -->
  <rect x="70" y="140" width="130" height="80" rx="3" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="135" y="178" text-anchor="middle" class="area-label">9호선 승강장</text>
  <text x="135" y="192" text-anchor="middle" font-size="9" fill="#475569">서쪽</text>
  <!-- B1: 개찰구 -->
  <rect x="230" y="140" width="140" height="38" rx="3" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="300" y="164" text-anchor="middle" class="area-label">개찰구</text>
  <!-- B1: 편의점 -->
  <rect x="185" y="188" width="80" height="30" rx="2" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="225" y="207" text-anchor="middle" font-size="10" fill="#475569">편의점</text>
  <!-- B1: 엘리베이터 -->
  <rect x="275" y="183" width="40" height="42" rx="3" class="elev-box"/>
  <text x="295" y="200" text-anchor="middle" font-size="10" fill="#2563EB">ELV</text>
  <text x="295" y="214" text-anchor="middle" font-size="9" fill="#2563EB">B1</text>
  <!-- B1: 환승통로 -->
  <rect x="325" y="188" width="90" height="30" rx="3" fill="#D1FAE5" stroke="#34D399" stroke-width="1"/>
  <text x="370" y="207" text-anchor="middle" font-size="10" fill="#065F46">환승통로</text>

  <!-- B1 Anchor markers -->
  <circle id="elev-B1-A01" cx="465" cy="195" r="6" class="anchor-dot" data-anchor="B1-A01"/>
  <circle id="elev-B1-A02" cx="135" cy="195" r="6" class="anchor-dot" data-anchor="B1-A02"/>
  <circle id="elev-B1-A03" cx="300" cy="160" r="6" class="anchor-dot" data-anchor="B1-A03"/>
  <circle id="elev-B1-A04" cx="120" cy="65" r="6" class="anchor-dot" data-anchor="B1-A04"/>
  <circle id="elev-B1-A05" cx="480" cy="65" r="6" class="anchor-dot" data-anchor="B1-A05"/>
  <circle id="elev-B1-A06" cx="295" cy="215" r="6" class="anchor-dot" data-anchor="B1-A06"/>
  <circle id="elev-B1-A07" cx="225" cy="207" r="6" class="anchor-dot" data-anchor="B1-A07"/>
  <circle id="elev-B1-A08" cx="370" cy="207" r="6" class="anchor-dot" data-anchor="B1-A08"/>

  <!-- 연결선 B1→B2: 계단(환승통로) + 엘리베이터 -->
  <line x1="370" y1="230" x2="370" y2="268" class="stair-line" stroke-dasharray="4,3"/>
  <line x1="295" y1="230" x2="295" y2="268" stroke="#2563EB" stroke-width="2"/>
  <text x="305" y="255" font-size="9" fill="#2563EB">ELV</text>

  <!-- ─── B2 층 (환승 개찰구) ─── -->
  <rect x="50" y="268" width="500" height="68" rx="4" fill="#E0E7FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="70" y="291" class="floor-label">B2</text>
  <text x="70" y="306" font-size="10" fill="#475569">환승 개찰구</text>

  <!-- B2: 엘리베이터 -->
  <rect x="265" y="276" width="40" height="52" rx="3" class="elev-box"/>
  <text x="285" y="295" text-anchor="middle" font-size="10" fill="#2563EB">ELV</text>
  <text x="285" y="309" text-anchor="middle" font-size="9" fill="#2563EB">B2</text>
  <!-- B2: 신림선 환승 개찰구 -->
  <rect x="330" y="282" width="120" height="44" rx="3" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="390" y="308" text-anchor="middle" class="area-label">신림선 환승 개찰구</text>

  <!-- B2 Anchor markers -->
  <circle id="elev-B2-A01" cx="285" cy="305" r="6" class="anchor-dot" data-anchor="B2-A01"/>
  <circle id="elev-B2-A02" cx="390" cy="318" r="6" class="anchor-dot" data-anchor="B2-A02"/>

  <!-- 연결선 B2→B3: 계단 -->
  <line x1="390" y1="338" x2="390" y2="365" class="stair-line" stroke-dasharray="4,3"/>
  <line x1="295" y1="338" x2="295" y2="365" stroke="#2563EB" stroke-width="2"/>
  <text x="305" y="355" font-size="9" fill="#2563EB">ELV</text>

  <!-- ─── B3 층 (환승 통로) ─── -->
  <rect x="50" y="365" width="500" height="38" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="70" y="383" class="floor-label">B3</text>
  <text x="160" y="383" font-size="10" fill="#94A3B8">환승 통로 (계단)</text>
  <text x="420" y="383" font-size="9" fill="#94A3B8" font-style="italic">앵커 미설치</text>

  <!-- 연결선 B3→B4: 계단 -->
  <line x1="390" y1="403" x2="390" y2="432" class="stair-line" stroke-dasharray="4,3"/>

  <!-- ─── B4 층 (신림선 승강장) ─── -->
  <rect x="50" y="432" width="500" height="90" rx="4" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="70" y="456" class="floor-label">B4</text>
  <text x="70" y="472" font-size="10" fill="#7C3AED">신림선 승강장</text>

  <!-- B4: 신림선 승강장 북 -->
  <rect x="160" y="442" width="130" height="35" rx="3" fill="#DDD6FE" stroke="#A78BFA" stroke-width="1"/>
  <text x="225" y="464" text-anchor="middle" class="area-label">신림선 승강장</text>
  <text x="225" y="477" text-anchor="middle" font-size="9" fill="#7C3AED">북쪽</text>
  <!-- B4: 신림선 승강장 남 -->
  <rect x="160" y="487" width="130" height="30" rx="3" fill="#DDD6FE" stroke="#A78BFA" stroke-width="1"/>
  <text x="225" y="507" text-anchor="middle" class="area-label">신림선 승강장 남쪽</text>

  <!-- B4 Anchor markers -->
  <circle id="elev-B4-A01" cx="225" cy="462" r="6" class="anchor-dot" data-anchor="B4-A01"/>
  <circle id="elev-B4-A02" cx="225" cy="502" r="6" class="anchor-dot" data-anchor="B4-A02"/>

  <!-- 경로 오버레이 레이어 (JS가 SVG polyline 추가) -->
  <g id="elev-path-overlay"></g>

  <!-- 현재위치 마커 (JS가 이동) -->
  <g id="elev-current-marker" style="display:none">
    <circle r="10" fill="#4A90D9" fill-opacity="0.3">
      <animate attributeName="r" values="8;14;8" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.4;0.1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#4A90D9"/>
  </g>
</svg>
