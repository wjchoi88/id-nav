<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" id="floor-b3-svg">
  <defs>
    <style>
      .fl  { font: bold 13px sans-serif; fill: #1E293B; }
      .al  { font: 11px sans-serif; fill: #475569; }
      .wall     { fill: #E2E8F0; stroke: #CBD5E1; stroke-width: 2; }
      .corridor { fill: #FFF7ED; stroke: #FED7AA; stroke-width: 1.5; }
      .dim-u    { fill: #DBEAFE; stroke: #93C5FD; stroke-width: 1; opacity: 0.22; }
      .dim-b    { fill: #EDE9FE; stroke: #A78BFA; stroke-width: 1; opacity: 0.22; }
      .dim-txt  { font: 11px sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#F8FAFC"/>

  <!-- 외벽 -->
  <rect x="50" y="55" width="900" height="690" rx="8" class="wall"/>

  <!-- 타 층 희미 표시: B2 (위) -->
  <rect x="330" y="60" width="340" height="70" rx="4" class="dim-u"/>
  <text x="500" y="102" text-anchor="middle" class="dim-txt">↑ B2 환승 개찰구</text>

  <!-- 타 층 희미 표시: B4 (아래) -->
  <rect x="170" y="668" width="260" height="70" rx="4" class="dim-b"/>
  <text x="300" y="710" text-anchor="middle" class="dim-txt">↓ B4 신림선 (관악산)</text>
  <rect x="570" y="668" width="260" height="70" rx="4" class="dim-b"/>
  <text x="700" y="710" text-anchor="middle" class="dim-txt">↓ B4 신림선 (샛강)</text>

  <!-- ══ 환승 통로 (사람이 걷는 바닥 전체) ══ -->
  <rect x="295" y="145" width="410" height="510" rx="4" class="corridor"/>

  <!-- 안내 텍스트 -->
  <text x="500" y="390" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400E">환승 통로</text>
  <text x="500" y="412" text-anchor="middle" class="al">B2 ↔ B4 연결 구간</text>
  <text x="500" y="432" text-anchor="middle" font-size="10" fill="#94A3B8">앵커 미설치</text>

  <!-- 계단 픽토그램 (왼쪽 상단) -->
  <g transform="translate(318,175)">
    <rect x="0"  y="42" width="14" height="14" fill="none" stroke="#D97706" stroke-width="2"/>
    <rect x="14" y="28" width="14" height="28" fill="none" stroke="#D97706" stroke-width="2"/>
    <rect x="28" y="14" width="14" height="42" fill="none" stroke="#D97706" stroke-width="2"/>
    <rect x="42" y="0"  width="14" height="56" fill="none" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="370" y="248" text-anchor="middle" font-size="10" fill="#D97706">계단</text>

  <!-- 계단 픽토그램 (오른쪽 하단) -->
  <g transform="translate(618,535)">
    <rect x="0"  y="42" width="14" height="14" fill="none" stroke="#D97706" stroke-width="2"/>
    <rect x="14" y="28" width="14" height="28" fill="none" stroke="#D97706" stroke-width="2"/>
    <rect x="28" y="14" width="14" height="42" fill="none" stroke="#D97706" stroke-width="2"/>
    <rect x="42" y="0"  width="14" height="56" fill="none" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="672" y="608" text-anchor="middle" font-size="10" fill="#D97706">계단</text>

  <!-- 층간 연결선 (세로, 위↔아래만) -->
  <line x1="500" y1="145" x2="500" y2="130" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="500" y1="655" x2="500" y2="668" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- 경로 오버레이 (JS) - overlay-b3 id 필수 -->
  <g id="overlay-b3"></g>
</svg>
