<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" id="floor-b4-svg">
  <defs>
    <style>
      .fl  { font: bold 13px sans-serif; fill: #1E293B; }
      .al  { font: 11px sans-serif; fill: #475569; }
      .wall     { fill: #E2E8F0; stroke: #CBD5E1; stroke-width: 2; }
      .corridor { fill: #FFF7ED; stroke: #FED7AA; stroke-width: 1.5; }
      .platform { fill: #EDE9FE; stroke: #A78BFA; stroke-width: 1.5; }
      .dim-u    { fill: #DBEAFE; stroke: #93C5FD; stroke-width: 1; opacity: 0.22; }
      .dim-txt  { font: 11px sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#F8FAFC"/>

  <!-- 외벽 -->
  <rect x="50" y="55" width="900" height="690" rx="8" class="wall"/>

  <!-- 타 층 희미 표시: B3 환승통로 (위) -->
  <rect x="330" y="60" width="340" height="70" rx="4" class="dim-u"/>
  <text x="500" y="102" text-anchor="middle" class="dim-txt">↑ B3 환승 통로</text>

  <!-- ══ 중앙 통로 (사람이 걷는 바닥) ══ -->
  <rect x="295" y="250" width="410" height="230" rx="4" class="corridor"/>

  <!-- 엘리베이터 픽토그램 (통로 내 왼쪽) -->
  <rect x="315" y="270" width="90" height="90" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <g transform="translate(330,282)">
    <polygon points="15,0 8,10 22,10" fill="#2563EB"/>
    <polygon points="45,30 38,20 52,20" fill="#2563EB"/>
    <rect x="0" y="12" width="36" height="36" rx="2" fill="none" stroke="#2563EB" stroke-width="2"/>
    <line x1="18" y1="12" x2="18" y2="48" stroke="#2563EB" stroke-width="1.5"/>
  </g>
  <text x="360" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">ELV</text>
  <text x="360" y="383" text-anchor="middle" font-size="9" fill="#2563EB">↑B3</text>

  <!-- 계단 픽토그램 (통로 내 오른쪽) -->
  <rect x="595" y="270" width="90" height="90" rx="4" fill="#D1FAE5" stroke="#34D399" stroke-width="1.5"/>
  <g transform="translate(607,285)">
    <rect x="0"  y="36" width="11" height="11" fill="none" stroke="#065F46" stroke-width="2"/>
    <rect x="11" y="24" width="11" height="23" fill="none" stroke="#065F46" stroke-width="2"/>
    <rect x="22" y="12" width="11" height="35" fill="none" stroke="#065F46" stroke-width="2"/>
    <rect x="33" y="0"  width="11" height="47" fill="none" stroke="#065F46" stroke-width="2"/>
  </g>
  <text x="640" y="370" text-anchor="middle" font-size="10" fill="#065F46">계단</text>
  <text x="640" y="383" text-anchor="middle" font-size="9" fill="#065F46">↑B3</text>

  <!-- ══ 신림선 승강장 (관악산 방면) — 위쪽 ══ -->
  <rect x="65" y="65" width="870" height="175" rx="4" class="platform"/>
  <!-- 선로 -->
  <line x1="80" y1="105" x2="920" y2="105" stroke="#A78BFA" stroke-width="3" stroke-dasharray="14,7"/>
  <line x1="80" y1="200" x2="920" y2="200" stroke="#A78BFA" stroke-width="3" stroke-dasharray="14,7"/>
  <text x="500" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#5B21B6">신림선</text>
  <text x="500" y="170" text-anchor="middle" class="al">관악산 방면</text>
  <!-- 앵커: 아래 가장자리 중간 (위 승강장 → 아래쪽에 마커) -->
  <circle id="map-B4-A01" cx="500" cy="240" r="7" fill="#F97316" stroke="#fff" stroke-width="2" data-anchor="B4-A01"/>

  <!-- ══ 신림선 승강장 (샛강 방면) — 아래쪽 ══ -->
  <rect x="65" y="558" width="870" height="175" rx="4" class="platform"/>
  <!-- 선로 -->
  <line x1="80" y1="598" x2="920" y2="598" stroke="#A78BFA" stroke-width="3" stroke-dasharray="14,7"/>
  <line x1="80" y1="695" x2="920" y2="695" stroke="#A78BFA" stroke-width="3" stroke-dasharray="14,7"/>
  <text x="500" y="640" text-anchor="middle" font-size="16" font-weight="bold" fill="#5B21B6">신림선</text>
  <text x="500" y="660" text-anchor="middle" class="al">샛강 방면</text>
  <!-- 앵커: 위 가장자리 중간 (대칭 하단 승강장 → 위쪽에 마커) -->
  <circle id="map-B4-A02" cx="500" cy="558" r="7" fill="#F97316" stroke="#fff" stroke-width="2" data-anchor="B4-A02"/>

  <!-- 층간 연결선 (세로, 위↔아래만) -->
  <line x1="360" y1="240" x2="360" y2="250" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="640" y1="240" x2="640" y2="250" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="360" y1="480" x2="360" y2="558" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="640" y1="480" x2="640" y2="558" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 범례 -->
  <rect x="760" y="270" width="145" height="60" rx="4" fill="rgba(255,255,255,0.92)" stroke="#CBD5E1"/>
  <text x="768" y="285" font-size="10" font-weight="bold" fill="#1E293B">범례</text>
  <rect x="768" y="291" width="12" height="8" rx="1" fill="#EDE9FE" stroke="#A78BFA"/>
  <text x="785" y="299" font-size="9" fill="#475569">신림선 승강장</text>
  <rect x="768" y="303" width="12" height="8" rx="1" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="785" y="311" font-size="9" fill="#475569">통로</text>
  <circle cx="773" cy="321" r="4" fill="#F97316"/>
  <text x="785" y="325" font-size="9" fill="#475569">QR 앵커</text>

  <!-- 경로 오버레이 (JS) - overlay-b4 id 필수 -->
  <g id="overlay-b4"></g>
</svg>
