<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" id="floor-b4-svg">
  <title>샛강역 B4 평면도 — 심층부 승강장</title>
  <defs>
    <style>
      .floor-label  { font: bold 13px sans-serif; fill: #004E89; }
      .area-label   { font: 11px sans-serif; fill: #333; }
      .anchor-label { font: 10px sans-serif; fill: #FF6B35; }
      .anchor-dot   { fill: #FF6B35; stroke: #fff; stroke-width: 2; }
      .wall         { fill: #F2F2F7; stroke: #8E8E93; stroke-width: 4; }
      .corridor     { fill: #FFFFFF; stroke: #ced4da; stroke-width: 1.5; }
      .platform     { fill: #b8d4f0; stroke: #004E89; stroke-width: 1.5; }
      .hall         { fill: #E3F2FD; stroke: #90CAF9; stroke-width: 1.5; }
      .stair        { fill: #EDE7F6; stroke: #7E57C2; stroke-width: 1.5; }
      .elevator     { fill: #007AFF; stroke: #0056B3; stroke-width: 2; }
      .escalator    { fill: #34C759; stroke: #1E7E34; stroke-width: 2; }
    </style>
    <!-- 계단 빗금 패턴 -->
    <pattern id="b4-stair-pattern" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7E57C2" stroke-width="1.5"/>
    </pattern>
    <marker id="b4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF6B35"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1000" height="800" fill="#F2F2F7"/>

  <!-- 층 제목 -->
  <text x="500" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#004E89">샛강역 B4 평면도 (심층부)</text>

  <!-- 층 번호 크게 -->
  <text x="940" y="760" text-anchor="middle" font-size="64" font-weight="bold" fill="#8E8E93" opacity="0.25">B4</text>

  <!-- ─── 외벽 ─── -->
  <rect x="50" y="60" width="900" height="710" rx="8" class="wall"/>

  <!-- ─── 통로: 중앙 메인 가로 통로 (y=380~420, x=50~950) ─── -->
  <rect x="50" y="380" width="900" height="40" rx="0" class="corridor"/>

  <!-- ─── 통로: 좌측 세로 통로 (x=80~180, y=150~650) ─── -->
  <rect x="80" y="60" width="100" height="710" rx="0" class="corridor"/>

  <!-- ─── 통로: 우측 세로 통로 (x=820~920, y=150~650) ─── -->
  <rect x="820" y="60" width="100" height="710" rx="0" class="corridor"/>

  <!-- ─── 계단: 좌측 상단 (x=50~180, y=150~280) ─── -->
  <rect x="50" y="75" width="130" height="160" rx="4" class="stair"/>
  <rect x="50" y="75" width="130" height="160" rx="4" fill="url(#b4-stair-pattern)" fill-opacity="0.5"/>
  <text x="115" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#7E57C2">계단</text>
  <text x="115" y="168" text-anchor="middle" font-size="11" fill="#555">↑ B3</text>

  <!-- ─── 엘리베이터: 우측 상단 (x=820~950, y=150~280) ─── -->
  <rect x="820" y="75" width="130" height="160" rx="4" class="elevator"/>
  <text x="885" y="148" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">ELV</text>
  <text x="885" y="171" text-anchor="middle" font-size="12" fill="#E0F0FF">↑ B3</text>

  <!-- ─── 중앙 대기 공간 (좌) (x=200~420, y=250~370) ─── -->
  <rect x="200" y="250" width="220" height="120" rx="6" class="hall"/>
  <text x="310" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">대기 공간</text>
  <text x="310" y="333" text-anchor="middle" font-size="11" fill="#555">(좌측)</text>

  <!-- ─── 중앙 대기 공간 (우) (x=580~800, y=250~370) ─── -->
  <rect x="580" y="250" width="220" height="120" rx="6" class="hall"/>
  <text x="690" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">대기 공간</text>
  <text x="690" y="333" text-anchor="middle" font-size="11" fill="#555">(우측)</text>

  <!-- ─── 에스컬레이터: 좌측 통로 중단 ─── -->
  <rect x="192" y="380" width="80" height="40" rx="4" class="escalator"/>
  <text x="232" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ESC</text>

  <!-- ─── 에스컬레이터: 우측 통로 중단 ─── -->
  <rect x="728" y="380" width="80" height="40" rx="4" class="escalator"/>
  <text x="768" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ESC</text>

  <!-- ─── 승강장: B4 승강장 (x=100~900, y=580~730) ─── -->
  <rect x="100" y="585" width="800" height="160" rx="6" class="platform"/>
  <text x="500" y="660" text-anchor="middle" font-size="22" font-weight="bold" fill="#004E89">B4 승강장</text>
  <text x="500" y="683" text-anchor="middle" font-size="13" fill="#555">← 방면 / 방면 →</text>
  <!-- 선로 표시 -->
  <line x1="110" y1="615" x2="890" y2="615" stroke="#004E89" stroke-width="3" stroke-dasharray="12,6"/>
  <line x1="110" y1="725" x2="890" y2="725" stroke="#004E89" stroke-width="3" stroke-dasharray="12,6"/>

  <!-- ─── 승강장 접근 통로 (대합실→승강장) ─── -->
  <rect x="390" y="420" width="220" height="160" rx="4" class="corridor"/>
  <text x="500" y="505" text-anchor="middle" font-size="13" fill="#666">승강장 접근</text>
  <!-- 개찰구 라인 -->
  <line x1="400" y1="455" x2="600" y2="455" stroke="#004E89" stroke-width="2" stroke-dasharray="12,6"/>
  <text x="500" y="472" text-anchor="middle" font-size="11" fill="#004E89">개찰구</text>

  <!-- ─── 하단 계단 (승강장 끝, 좌) ─── -->
  <rect x="50" y="620" width="120" height="100" rx="4" class="stair"/>
  <rect x="50" y="620" width="120" height="100" rx="4" fill="url(#b4-stair-pattern)" fill-opacity="0.5"/>
  <text x="110" y="672" text-anchor="middle" font-size="13" font-weight="bold" fill="#7E57C2">계단</text>

  <!-- ─── 하단 엘리베이터 (승강장 끝, 우) ─── -->
  <rect x="830" y="620" width="120" height="100" rx="4" class="elevator"/>
  <text x="890" y="672" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">ELV</text>

  <!-- ─── 범례 ─── -->
  <rect x="60" y="475" width="195" height="60" rx="4" fill="rgba(255,255,255,0.92)" stroke="#ced4da"/>
  <text x="70" y="492" font-size="11" font-weight="bold" fill="#333">범례</text>
  <rect x="70" y="498" width="14" height="10" fill="#FFFFFF" stroke="#ced4da"/>
  <text x="90" y="507" font-size="10" fill="#333">통로 (이동 가능 구역)</text>
  <rect x="70" y="512" width="14" height="10" fill="#E3F2FD" stroke="#90CAF9"/>
  <text x="90" y="521" font-size="10" fill="#333">대기 공간</text>
  <rect x="135" y="498" width="14" height="10" fill="#007AFF" stroke="#0056B3"/>
  <text x="154" y="507" font-size="10" fill="#333">엘리베이터</text>
  <rect x="135" y="512" width="14" height="10" fill="#34C759" stroke="#1E7E34"/>
  <text x="154" y="521" font-size="10" fill="#333">에스컬레이터</text>

  <!-- ─── 경로 오버레이 레이어 (JS가 SVG polyline 추가) ─── -->
  <g id="b4-path-overlay"></g>

  <!-- ─── 현재위치 마커 (JS가 cx/cy 조정) ─── -->
  <g id="b4-current-marker" style="display:none">
    <circle r="14" fill="#4A90D9" fill-opacity="0.2">
      <animate attributeName="r" values="10;18;10" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.3;0.05;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#4A90D9" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- ─── 목적지 마커 (JS가 위치 조정) ─── -->
  <g id="b4-dest-marker" style="display:none">
    <polygon points="0,-14 4,-6 13,-6 6,0 9,9 0,4 -9,9 -6,0 -13,-6 -4,-6" fill="#FF6B35" stroke="#fff" stroke-width="1.5"/>
  </g>
</svg>
