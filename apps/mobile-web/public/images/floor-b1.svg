<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" id="floor-b1-svg">
  <defs>
    <style>
      .floor-label  { font: bold 13px sans-serif; fill: #004E89; }
      .area-label   { font: 11px sans-serif; fill: #333; }
      .anchor-label { font: 10px sans-serif; fill: #FF6B35; }
      .anchor-dot   { fill: #FF6B35; stroke: #fff; stroke-width: 2; }
      .wall         { fill: #dee2e6; stroke: #adb5bd; stroke-width: 2; }
      .platform     { fill: #b8d4f0; stroke: #004E89; stroke-width: 1.5; }
      .corridor     { fill: #f0f4f8; stroke: #ced4da; stroke-width: 1; }
      .facility     { fill: #fff3cd; stroke: #ffc107; stroke-width: 1.5; }
      .gate         { fill: #c8dff5; stroke: #004E89; stroke-width: 1.5; }
      .elevator     { fill: #e8f4fd; stroke: #004E89; stroke-width: 2; }
      .transfer     { fill: #d4edda; stroke: #28a745; stroke-width: 1.5; }
      .exit-box     { fill: #e2f0d9; stroke: #70ad47; stroke-width: 1.5; }
    </style>
    <marker id="b1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF6B35"/>
    </marker>
    <marker id="b1-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4A90D9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>

  <!-- Floor title -->
  <text x="500" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#004E89">샛강역 B1 평면도 (9호선)</text>

  <!-- ─── 외벽 ─── -->
  <rect x="50" y="60" width="900" height="680" rx="8" class="wall"/>

  <!-- ─── 승강장 동쪽 (B1-A01) — map_x=800, map_y=400 ─── -->
  <!-- 전체 평면: 실제 좌표 범위 150~850, 100~700 → viewBox 1000x800으로 스케일 -->
  <!-- map_x, map_y를 그대로 viewBox 좌표로 사용 (seed.sql 기준) -->
  <rect x="680" y="300" width="230" height="200" rx="4" class="platform"/>
  <text x="795" y="390" text-anchor="middle" class="floor-label">9호선 승강장</text>
  <text x="795" y="408" text-anchor="middle" class="area-label">동쪽 (B1-A01)</text>
  <!-- 선로 표시 -->
  <line x1="710" y1="370" x2="900" y2="370" stroke="#004E89" stroke-width="3" stroke-dasharray="10,5"/>
  <line x1="710" y1="430" x2="900" y2="430" stroke="#004E89" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- ─── 승강장 서쪽 (B1-A02) — map_x=200, map_y=400 ─── -->
  <rect x="90" y="300" width="230" height="200" rx="4" class="platform"/>
  <text x="205" y="390" text-anchor="middle" class="floor-label">9호선 승강장</text>
  <text x="205" y="408" text-anchor="middle" class="area-label">서쪽 (B1-A02)</text>
  <line x1="100" y1="370" x2="310" y2="370" stroke="#004E89" stroke-width="3" stroke-dasharray="10,5"/>
  <line x1="100" y1="430" x2="310" y2="430" stroke="#004E89" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- ─── 중앙 통로 ─── -->
  <rect x="320" y="250" width="360" height="340" rx="4" class="corridor"/>

  <!-- ─── 개찰구 (B1-A03) — map_x=500, map_y=300 ─── -->
  <rect x="390" y="260" width="220" height="80" rx="4" class="gate"/>
  <text x="500" y="305" text-anchor="middle" class="floor-label">개찰구</text>
  <text x="500" y="322" text-anchor="middle" class="area-label">B1-A03</text>
  <!-- 개찰구 바 표시 -->
  <line x1="410" y1="285" x2="600" y2="285" stroke="#004E89" stroke-width="2" stroke-dasharray="15,8"/>

  <!-- ─── 엘리베이터 (B1-A06) — map_x=500, map_y=200 ─── -->
  <rect x="465" y="170" width="70" height="70" rx="4" class="elevator"/>
  <text x="500" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#004E89">ELV</text>
  <text x="500" y="222" text-anchor="middle" class="area-label">B1-A06</text>

  <!-- ─── 편의점 (B1-A07) — map_x=350, map_y=300 ─── -->
  <rect x="330" y="270" width="100" height="60" rx="4" class="facility"/>
  <text x="380" y="300" text-anchor="middle" class="floor-label">편의점</text>
  <text x="380" y="316" text-anchor="middle" class="area-label">B1-A07</text>

  <!-- ─── 환승 통로 (B1-A08) — map_x=500, map_y=500 ─── -->
  <rect x="390" y="460" width="220" height="90" rx="4" class="transfer"/>
  <text x="500" y="503" text-anchor="middle" class="floor-label">환승 통로 입구</text>
  <text x="500" y="520" text-anchor="middle" class="area-label">B1-A08 → B2</text>
  <!-- 화살표 아래쪽 표시 -->
  <polygon points="500,555 485,540 515,540" fill="#28a745"/>

  <!-- ─── 1번 출구 (B1-A04) — map_x=150, map_y=100 ─── -->
  <rect x="90" y="65" width="160" height="60" rx="4" class="exit-box"/>
  <text x="170" y="93" text-anchor="middle" class="floor-label">1번 출구</text>
  <text x="170" y="110" text-anchor="middle" class="area-label">B1-A04 ↑</text>
  <!-- 계단 표시 -->
  <line x1="140" y1="125" x2="140" y2="200" stroke="#70ad47" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="200" y1="125" x2="200" y2="200" stroke="#70ad47" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- ─── 2번 출구 (B1-A05) — map_x=850, map_y=100 ─── -->
  <rect x="750" y="65" width="160" height="60" rx="4" class="exit-box"/>
  <text x="830" y="93" text-anchor="middle" class="floor-label">2번 출구</text>
  <text x="830" y="110" text-anchor="middle" class="area-label">B1-A05 ↑</text>
  <line x1="800" y1="125" x2="800" y2="200" stroke="#70ad47" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="860" y1="125" x2="860" y2="200" stroke="#70ad47" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- ─── 범례 ─── -->
  <rect x="60" y="620" width="200" height="100" rx="4" fill="rgba(255,255,255,0.9)" stroke="#ced4da"/>
  <text x="70" y="638" font-size="11" font-weight="bold" fill="#333">범례</text>
  <circle cx="75" cy="653" r="5" fill="#4A90D9"/>
  <text x="85" y="657" font-size="10" fill="#333">지나온 경로</text>
  <circle cx="75" cy="671" r="5" fill="#FF6B35"/>
  <text x="85" y="675" font-size="10" fill="#333">앞으로 갈 경로</text>
  <circle cx="75" cy="689" r="6" fill="#4A90D9"/>
  <text x="85" y="693" font-size="10" fill="#333">현재 위치</text>
  <polygon points="75,705 70,713 80,713" fill="#FF6B35"/>
  <text x="85" y="713" font-size="10" fill="#333">목적지</text>

  <!-- ─── Anchor 마커 (seed.sql map_x, map_y 기준) ─── -->
  <!-- B1-A01: map_x=800, map_y=400 -->
  <circle id="map-B1-A01" cx="800" cy="400" r="8" class="anchor-dot" data-anchor="B1-A01"/>
  <text x="800" y="420" text-anchor="middle" class="anchor-label">A01</text>

  <!-- B1-A02: map_x=200, map_y=400 -->
  <circle id="map-B1-A02" cx="200" cy="400" r="8" class="anchor-dot" data-anchor="B1-A02"/>
  <text x="200" y="420" text-anchor="middle" class="anchor-label">A02</text>

  <!-- B1-A03: map_x=500, map_y=300 -->
  <circle id="map-B1-A03" cx="500" cy="300" r="8" class="anchor-dot" data-anchor="B1-A03"/>
  <text x="500" y="320" text-anchor="middle" class="anchor-label">A03</text>

  <!-- B1-A04: map_x=150, map_y=100 -->
  <circle id="map-B1-A04" cx="150" cy="100" r="8" class="anchor-dot" data-anchor="B1-A04"/>
  <text x="150" y="120" text-anchor="middle" class="anchor-label">A04</text>

  <!-- B1-A05: map_x=850, map_y=100 -->
  <circle id="map-B1-A05" cx="850" cy="100" r="8" class="anchor-dot" data-anchor="B1-A05"/>
  <text x="850" y="120" text-anchor="middle" class="anchor-label">A05</text>

  <!-- B1-A06: map_x=500, map_y=200 -->
  <circle id="map-B1-A06" cx="500" cy="200" r="8" class="anchor-dot" data-anchor="B1-A06"/>
  <text x="500" y="168" text-anchor="middle" class="anchor-label">A06(ELV)</text>

  <!-- B1-A07: map_x=350, map_y=300 -->
  <circle id="map-B1-A07" cx="350" cy="300" r="8" class="anchor-dot" data-anchor="B1-A07"/>
  <text x="350" y="260" text-anchor="middle" class="anchor-label">A07</text>

  <!-- B1-A08: map_x=500, map_y=500 -->
  <circle id="map-B1-A08" cx="500" cy="500" r="8" class="anchor-dot" data-anchor="B1-A08"/>
  <text x="550" y="500" class="anchor-label">A08</text>

  <!-- ─── 경로 오버레이 레이어 (JS가 SVG polyline 추가) ─── -->
  <g id="b1-path-overlay"></g>

  <!-- ─── 현재위치 마커 (JS가 cx/cy 조정) ─── -->
  <g id="b1-current-marker" style="display:none">
    <circle r="14" fill="#4A90D9" fill-opacity="0.2">
      <animate attributeName="r" values="10;18;10" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.3;0.05;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#4A90D9" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- ─── 목적지 마커 (JS가 위치 조정) ─── -->
  <g id="b1-dest-marker" style="display:none">
    <polygon points="0,-14 4,-6 13,-6 6,0 9,9 0,4 -9,9 -6,0 -13,-6 -4,-6" fill="#FF6B35" stroke="#fff" stroke-width="1.5"/>
  </g>
</svg>
