<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>샛강역 내비 — QR 테스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1A3C5E;
      --accent: #FF6B35;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1a2535;
      --muted: #6c757d;
      --border: #e2e8f0;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── 헤더 ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    header .badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    header h1 {
      font-size: 17px;
      font-weight: 700;
      flex: 1;
    }
    header .sub {
      font-size: 12px;
      opacity: 0.7;
    }

    /* ── 본문 ── */
    main {
      padding: 20px 16px;
      max-width: 520px;
      margin: 0 auto;
    }

    .guide-box {
      background: #EBF5FF;
      border: 1px solid #BFD9F2;
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #1A3C5E;
      line-height: 1.6;
    }
    .guide-box strong { font-weight: 700; }

    /* ── 층 섹션 ── */
    .floor-section { margin-bottom: 24px; }
    .floor-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    /* ── 앵커 카드 그리드 ── */
    .anchor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .anchor-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .anchor-btn:active { background: #f0f4f8; }
    .anchor-btn.selected {
      border-color: var(--accent);
      background: #FFF5F0;
      box-shadow: 0 0 0 3px rgba(255,107,53,0.15);
    }

    .anchor-code {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
      font-family: monospace;
    }
    .anchor-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .anchor-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    .tag-elevator { background: #E8F5E9; color: #2E7D32; }
    .tag-exit     { background: #E3F2FD; color: #1565C0; }
    .tag-dest     { background: #FFF8E1; color: #F57F17; }

    /* ── QR 모달 오버레이 ── */
    #qr-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #qr-overlay.open { display: flex; }

    #qr-modal {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    #qr-modal .modal-anchor-code {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      font-family: monospace;
      margin-bottom: 4px;
    }
    #qr-modal .modal-label {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 20px;
    }
    #qr-code-wrap {
      display: inline-block;
      padding: 16px;
      background: #fff;
      border-radius: 12px;
      border: 2px solid var(--border);
      margin-bottom: 16px;
    }
    #qr-url-text {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 20px;
      padding: 0 8px;
      line-height: 1.5;
    }

    .modal-close-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .modal-close-btn:active { opacity: 0.85; }

    /* ── 로딩 / 에러 ── */
    .state-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div style="flex:1">
    <h1>샛강역 내비 QR 테스트</h1>
    <div class="sub">앵커를 선택하면 QR 코드를 표시합니다</div>
  </div>
  <span class="badge">TEST</span>
</header>

<main>
  <div class="guide-box">
    <strong>사용법</strong><br>
    아래 목록에서 <strong>앵커(위치)</strong>를 선택하면 해당 위치의 QR 코드가 나타납니다.<br>
    스마트폰 카메라로 QR을 스캔하면 실제 내비게이션 앱으로 이동합니다.
  </div>

  <div id="anchor-list">
    <div class="state-msg">
      <div class="spinner"></div>
      앵커 목록 로드 중…
    </div>
  </div>
</main>

<!-- QR 모달 -->
<div id="qr-overlay" onclick="closeQr(event)">
  <div id="qr-modal">
    <div class="modal-anchor-code" id="modal-code"></div>
    <div class="modal-label" id="modal-label"></div>
    <div id="qr-code-wrap">
      <div id="qr-code"></div>
    </div>
    <div id="qr-url-text"></div>
    <button class="modal-close-btn" onclick="closeModal()">닫기</button>
  </div>
</div>

<!-- QR 코드 생성 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
'use strict';

let qrInstance = null;
let selectedBtn = null;

// ── 앵커 로드 ──────────────────────────────────────────────
async function loadAnchors() {
  const listEl = document.getElementById('anchor-list');
  try {
    const res = await fetch('/api/test/anchors');
    if (!res.ok) throw new Error('서버 응답 오류');
    const grouped = await res.json();  // { B1: [...], B2: [...] }

    if (!grouped || Object.keys(grouped).length === 0) {
      listEl.innerHTML = '<div class="state-msg">앵커 데이터가 없습니다.</div>';
      return;
    }

    listEl.innerHTML = '';
    // 층 순서: B1 먼저
    const floors = Object.keys(grouped).sort();
    floors.forEach(floor => {
      const anchors = grouped[floor];
      if (!anchors || !anchors.length) return;

      const section = document.createElement('div');
      section.className = 'floor-section';
      section.innerHTML = `<div class="floor-label">${floor} 층</div>`;

      const grid = document.createElement('div');
      grid.className = 'anchor-grid';

      anchors.forEach(anchor => {
        const btn = document.createElement('button');
        btn.className = 'anchor-btn';
        btn.setAttribute('aria-label', `${anchor.label} QR 보기`);

        const tags = [];
        if (anchor.is_elevator) tags.push('<span class="tag tag-elevator">엘리베이터</span>');
        if (anchor.is_exit)     tags.push('<span class="tag tag-exit">출구</span>');
        if (anchor.is_destination) tags.push('<span class="tag tag-dest">목적지</span>');

        btn.innerHTML = `
          <span class="anchor-code">${anchor.anchor_code}</span>
          <span class="anchor-label">${anchor.label}</span>
          ${tags.length ? `<span class="anchor-tags">${tags.join('')}</span>` : ''}
        `;
        btn.onclick = () => showQr(anchor, btn);
        grid.appendChild(btn);
      });

      section.appendChild(grid);
      listEl.appendChild(section);
    });
  } catch (err) {
    listEl.innerHTML = `<div class="state-msg">앵커를 불러오지 못했습니다.<br><small>${err.message}</small></div>`;
  }
}

// ── QR 표시 ────────────────────────────────────────────────
function showQr(anchor, btn) {
  // 선택 상태 표시
  if (selectedBtn) selectedBtn.classList.remove('selected');
  btn.classList.add('selected');
  selectedBtn = btn;

  const url = anchor.qr_url || `https://id-nav.databuilder.co.kr/scan/${anchor.anchor_code}`;

  document.getElementById('modal-code').textContent  = anchor.anchor_code;
  document.getElementById('modal-label').textContent = anchor.label;
  document.getElementById('qr-url-text').textContent = url;

  // QR 초기화 후 생성
  const wrap = document.getElementById('qr-code');
  wrap.innerHTML = '';
  qrInstance = new QRCode(wrap, {
    text: url,
    width: 200,
    height: 200,
    colorDark: '#1A3C5E',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById('qr-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('qr-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeQr(e) {
  // 오버레이 배경 클릭 시 닫기 (모달 내부 클릭은 무시)
  if (e.target === document.getElementById('qr-overlay')) closeModal();
}

// ESC 키로 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// 초기화
loadAnchors();
</script>
</body>
</html>
